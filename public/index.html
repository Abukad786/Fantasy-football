<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gaffer · FPL rival tracker</title>
  <meta name="description" content="Fantasy Premier League news, Opta-based insights and mini-league rival comparison.">
  <meta name="theme-color" content="#1b0f2e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a href="#home" class="brand"><img src="icons/icon.svg" alt="" width="26" height="26"> Gaffer</a>
    <a href="#settings" class="icon-btn" aria-label="Settings">⚙</a>
  </header>
  <main id="main"><div class="loading">Loading FPL data…</div></main>
  <nav class="tabs">
    <a href="#home" data-tab="home"><span>⌂</span>Home</a>
    <a href="#team" data-tab="team"><span>⚽</span>My team</a>
    <a href="#leagues" data-tab="leagues"><span>🏆</span>Leagues</a>
    <a href="#insights" data-tab="insights"><span>📈</span>Insights</a>
    <a href="#coach" data-tab="coach"><span>🧠</span>Coach</a>
    <a href="#creators" data-tab="creators"><span>🎥</span>Creators</a>
    <a href="#news" data-tab="news"><span>📰</span>News</a>
  </nav>
  <div id="sheet" class="sheet" aria-hidden="true">
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <button class="sheet-close" aria-label="Close">✕</button>
      <div id="sheet-body"></div>
    </div>
  </div>
  <div id="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
